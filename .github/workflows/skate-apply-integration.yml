name: SKATE apply model integration

on:
  push:
    branches: [skate-model-integration]
    paths:
      - '.github/workflows/skate-apply-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: skate-model-integration
      - name: Patch SKATE UI and PWA cache
        run: python .github/scripts/patch_skate_models.py
      - name: Sanity check JavaScript syntax
        run: |
          node --check skate-family/src/main-v11.js
          node --check skate-family/src/multi-analyzer.js
          node --check skate-family/src/fall-model.js
          node --check skate-family/src/cascade-score.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skate-family/src skate-family/index.html skate-family/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use specialist fall model and one GOE for cascades"
          git push origin HEAD:skate-model-integration
