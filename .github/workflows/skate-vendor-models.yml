name: SKATE vendor open models

on:
  push:
    branches: [skate-model-integration]
    paths:
      - '.github/workflows/skate-vendor-models.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: skate-model-integration
      - name: Download MIT fall Transformer model
        run: |
          set -euo pipefail
          mkdir -p skate-family/models
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/punpayut/Fall-Detection/main/deployment/huggingface_space/fall_detection_transformer.tflite \
            -o skate-family/models/fall_detection_transformer.tflite
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/punpayut/Fall-Detection/main/LICENSE \
            -o skate-family/models/THIRD_PARTY_FALL_DETECTION_LICENSE.txt
          test $(wc -c < skate-family/models/fall_detection_transformer.tflite) -gt 300000
          cat > skate-family/models/MODEL_SOURCES.md <<'EOF'
          # SKATE specialist model sources

          ## Fall detection
          - Source: https://github.com/punpayut/Fall-Detection
          - Artifact: `fall_detection_transformer.tflite`
          - Architecture: pose-sequence Transformer, 30 frames x 17 keypoints x (x,y,confidence)
          - Reported result by upstream project: 94.9% F1, 94.1% fall recall
          - License: MIT. Full upstream license is stored alongside the model.

          The model was not trained specifically on figure-skating falls. SKATE treats its output as one signal in a skating-specific fall decision, together with post-landing pose geometry and motion.
          EOF
      - name: Commit vendored model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skate-family/models
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add open Transformer fall detector for SKATE"
          git push origin HEAD:skate-model-integration
