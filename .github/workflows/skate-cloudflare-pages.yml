name: Deploy SKATE to Cloudflare Pages

on:
  push:
    branches:
      - skate-cloudflare
    paths:
      - 'skate-family/**'
      - '.github/workflows/skate-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | grep -oE '[A-Za-z0-9_-]{30,}' | tail -n 1)"
          if [ -z "$TOKEN" ]; then
            echo 'Cloudflare token could not be normalized.' >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        shell: bash
        run: npx --yes wrangler@4.141.0 pages project create skate-family --production-branch=skate-cloudflare

      - name: Deploy to Cloudflare Pages
        shell: bash
        run: npx --yes wrangler@4.141.0 pages deploy skate-family --project-name=skate-family --branch=skate-cloudflare --commit-dirty=true

      - name: Verify Cloudflare Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for path in / /manifest.webmanifest /sw.js /icons/skate-180-v7.png; do
            echo "Checking ${path}"
            curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors \
              --output /tmp/skate-check "https://skate-family.pages.dev${path}"
            test -s /tmp/skate-check
          done
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors \
            --output /tmp/skate-index https://skate-family.pages.dev/
          grep -q 'SKATE' /tmp/skate-index
          echo 'SKATE Cloudflare Pages verification passed.'
